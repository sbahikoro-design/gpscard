name: Compiler l'APK BS CLEAN

on:
  push:
    branches: [bs-clean]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilation
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk BS_CLEAN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BS_CLEAN-apk
          path: BS_CLEAN.apk

      - name: Publication (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bs-clean-v1.0.${{ github.run_number }}
          name: BS CLEAN v1.0 (build ${{ github.run_number }})
          target_commitish: bs-clean
          files: BS_CLEAN.apk
          body: Nettoyage en profondeur du téléphone — installer BS_CLEAN.apk.
