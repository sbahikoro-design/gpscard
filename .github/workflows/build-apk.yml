name: Compiler l'APK BS IR SCAN

on:
  push:
    branches: [bs-ir-scan]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilation
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk BS_IR_SCAN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BS_IR_SCAN-apk
          path: BS_IR_SCAN.apk

      - name: Publication (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bs-ir-scan-v2.0
          name: BS IR SCAN v2.0
          target_commitish: bs-ir-scan
          files: BS_IR_SCAN.apk
          body: Télécommande infrarouge universelle — installer BS_IR_SCAN.apk sur un téléphone Android équipé d'un émetteur IR.
