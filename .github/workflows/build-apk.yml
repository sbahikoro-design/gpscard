name: Compiler l'APK BS CALLMagic

on:
  push:
    branches: [bs-callmagic]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilation
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk BS_CALLMagic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BS_CALLMagic-apk
          path: BS_CALLMagic.apk

      - name: Publication (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bs-callmagic-v3.0
          name: BS CALLMagic v3.0
          target_commitish: bs-callmagic
          files: BS_CALLMagic.apk
          body: Nouveau — contact par Internet (code BS chiffré ou adresse IP), annuaire des personnes disponibles avec leur accès (Wi-Fi, Bluetooth, Internet), conversations privées, historique conservé. Toujours — salon de groupe, messages, vocaux, fichiers, appels audio et vidéo sans Internet (Wi-Fi ou Bluetooth), mode interphone, bulle flottante et réception en arrière-plan. Installer BS_CALLMagic.apk sur les deux téléphones.
