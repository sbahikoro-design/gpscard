name: Compiler l'APK BS CALLMagic

on:
  push:
    branches: [bs-callmagic]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilation
        run: |
          gradle assembleStandardRelease assemblePontRelease --no-daemon
          cp app/build/outputs/apk/standard/release/app-standard-release.apk BS_CALLMagic.apk
          cp app/build/outputs/apk/pont/release/app-pont-release.apk BS_CALLMagic_PontSMS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BS_CALLMagic-apk
          path: |
            BS_CALLMagic.apk
            BS_CALLMagic_PontSMS.apk

      - name: Publication (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bs-callmagic-v4.1
          name: BS CALLMagic v4.1
          target_commitish: bs-callmagic
          files: |
            BS_CALLMagic.apk
            BS_CALLMagic_PontSMS.apk
          body: v4.1 — BS_CALLMagic.apk = édition normale (sans autorisation SMS, acceptée par Play Protect) pour tout le monde. BS_CALLMagic_PontSMS.apk = seulement pour les téléphones qui servent de pont SMS. Signature fixe BSINALY.
